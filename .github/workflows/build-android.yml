name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch full map resources if not committed in repo
        run: |
          if [ ! -d "resources/maps/surrounded" ]; then
            echo "Fetching full map resources from openfrontio/OpenFrontIO..."
            git clone --depth 1 --filter=blob:none --sparse https://github.com/openfrontio/OpenFrontIO.git /tmp/openfront-res
            cd /tmp/openfront-res
            git sparse-checkout set resources
            cd "$GITHUB_WORKSPACE"
            mkdir -p resources
            cp -rn /tmp/openfront-res/resources/* resources/ || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cryptography for APK v1/v2 signing
        run: pip install cryptography

      - name: Generate CSS, index.html, and signed Android APK
        run: |
          python3 generate_css_and_html.py
          python3 build_index_html.py
          python3 build_apk.py

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(cat package.json | grep '"version"' | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenFront Android v${{ steps.version.outputs.version }}
          body: |
            Unofficial Android port of [Open Front](https://openfront.io/).
            
            **Features:**
            - ✅ Single-player mode (offline vs AI)
            - ✅ Saving functionality (local game persistence)
            - ✅ Touch-optimized controls
            - ✅ Full game content
            
            Built from commit ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            OpenFront_Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload OpenFront_Android.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFront_Android_APK
          path: OpenFront_Android.apk
