<!doctype html>
<html lang="en" class="h-full" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>OpenFront Android</title>
    <style id="main-styles">

:root {
  --default-ring-width: 3px;
  --default-ring-color: #0084d1;
  --font-display: "OpenFront", Inter, Arial, sans-serif;
  --color-malibu-blue: #0084d1;
  --color-aquarius: #3fa9f5;
  --color-dawn-blue: #cccccc;
  --color-bright-white: #ffffff;
  --color-bright-blue: #1e90ff;
  --color-cyber-yellow: #ffd700;
  --color-limestone: #999999;
  --color-deep-navy: #0a1628;
  --color-hex-cyan: #00c8ff;
  --color-frame-orange: #f97316;
  --color-surface: #0a1628;
  --color-gray-200: #e5e7eb;
  --color-gray-400: #9ca3af;
  --color-gray-700: #374151;
  --color-gray-800: #1f2937;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
@keyframes pulse { 50% { opacity: .5; } }
*, ::after, ::before { box-sizing: border-box; border-width: 0; border-style: solid; border-color: rgba(255,255,255,0.15); }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #111827; color: #ffffff; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
button { background: transparent; color: inherit; font: inherit; cursor: pointer; }

:root {
  --theme: "light";
  --breakPoint-tablet: 800px;
  --breakPoint-Desktop: 1024px;
  --blur-md: 4px;
  --boxBackgroundColor: #111827cc;
  --fontColor: #202020;
  --fontColorLight: #fff;

  --primaryColorHover: var(--color-malibu-blue);
  --primaryColorDisabled: linear-gradient(
    to right,
    rgb(74, 74, 74),
    rgb(61, 61, 61)
  );
  --secondaryColor: var(--color-malibu-blue);
  --secondaryColorHover: var(--color-aquarius);
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

  --primaryColorHoverDark: var(--color-malibu-blue);
  --primaryColorDisabledDark: #4b5563;
  --secondaryColorDark: var(--color-malibu-blue);
  --secondaryColorHoverDark: var(--color-aquarius);
  --fontColorDark: #f3f4f6;

  /* Achievements */
  --medal-easy: #cd7f32;
  --medal-medium: #c0c0c0;
  --medal-hard: var(--color-cyber-yellow);
  --medal-impossible: #d32f2f;
  --medal-custom: #2196f3;
}

.t-link {
  color: #ffffffb3;
  transition: var(--transition);

  &:hover {
    color: #fff;
    transition: var(--transition);
  }
}

.t-text-white {
  color: #ffffffb3;
}

@keyframes rainbow {
  0% {
    background-color: #990033;
  }
  16% {
    background-color: #996600;
  }
  32% {
    background-color: #336600;
  }
  48% {
    background-color: #008080;
  }
  64% {
    background-color: #1c3f99;
  }
  80% {
    background-color: #5e0099;
  }
  100% {
    background-color: #990033;
  }
}

.flag-color-rainbow {
  animation: rainbow 7s infinite;
}

@keyframes brightRainbow {
  0% {
    background-color: #ff0000;
  } /* Red */
  16% {
    background-color: #ffa500;
  } /* Orange */
  32% {
    background-color: #ffff00;
  } /* Yellow */
  48% {
    background-color: #00ff00;
  } /* Green */
  64% {
    background-color: #00ffff;
  } /* Cyan */
  80% {
    background-color: #0000ff;
  } /* Blue */
  100% {
    background-color: #ff0000;
  } /* Back to red */
}

.flag-color-bright-rainbow {
  animation: brightRainbow 7s linear infinite;
}

@keyframes copperGlow {
  0%,
  100% {
    background-color: #b87333;
    filter: brightness(1);
  }
  50% {
    background-color: #cd7f32;
    filter: brightness(1.4);
  }
}

.flag-color-copper-glow {
  animation: copperGlow 3s ease-in-out infinite;
}

@keyframes silverGlow {
  0%,
  100% {
    background-color: #c0c0c0;
    filter: brightness(1);
  }
  50% {
    background-color: #e0e0e0;
    filter: brightness(1.5);
  }
}

.flag-color-silver-glow {
  animation: silverGlow 3s ease-in-out infinite;
}

@keyframes goldGlow {
  0%,
  100% {
    background-color: #ffd700;
    filter: brightness(1);
  }
  50% {
    background-color: #fff8dc;
    filter: brightness(1.6);
  }
}

.flag-color-gold-glow {
  animation: goldGlow 3s ease-in-out infinite;
}

@keyframes neonPulseGreen {
  0%,
  100% {
    background-color: #39ff14;
    box-shadow:
      0 0 4px #39ff14,
      0 0 8px #39ff14;
    filter: brightness(1);
    transform: scale(1);
    opacity: 1;
  }
  25% {
    background-color: #2aff60;
    box-shadow:
      0 0 8px #2aff60,
      0 0 12px #2aff60;
    filter: brightness(1.2);
    transform: scale(1.05);
    opacity: 0.9;
  }
  50% {
    background-color: #00ff88;
    box-shadow:
      0 0 12px #00ff88,
      0 0 20px #00ff88;
    filter: brightness(1.4);
    transform: scale(1.12);
    opacity: 0.7;
  }
  75% {
    background-color: #2aff60;
    box-shadow:
      0 0 8px #2aff60,
      0 0 12px #2aff60;
    filter: brightness(1.2);
    transform: scale(1.05);
    opacity: 0.9;
  }
}

.flag-color-neon {
  animation: neonPulseGreen 3s ease-in-out infinite;
  will-change: transform, opacity, filter;
}

@keyframes waterFlicker {
  0% {
    transform: translateY(0px) scale(1);
    filter: brightness(1);
    opacity: 0.9;
    background-color: #00bfff;
  }
  12% {
    transform: translateY(-1px) scale(1.01);
    filter: brightness(1.05);
    opacity: 0.95;
    background-color: #1e90ff;
  }
  27% {
    transform: translateY(1px) scale(1.02);
    filter: brightness(1.15);
    opacity: 1;
    background-color: #87cefa;
  }
  45% {
    transform: translateY(-0.5px) scale(1.01);
    filter: brightness(1.05);
    opacity: 0.93;
    background-color: #4682b4;
  }
  63% {
    transform: translateY(0.7px) scale(1.03);
    filter: brightness(1.2);
    opacity: 1;
    background-color: #87cefa;
  }
  80% {
    transform: translateY(-1px) scale(1);
    filter: brightness(1);
    opacity: 0.88;
    background-color: #1e90ff;
  }
  100% {
    transform: translateY(0px) scale(1);
    filter: brightness(1);
    opacity: 0.9;
    background-color: #00bfff;
  }
}

.flag-color-water {
  animation: waterFlicker 6.2s ease-in-out infinite;
  will-change: transform, opacity, filter;
}

@keyframes lavaFlow {
  0% {
    background-color: #ff4500;
    filter: brightness(1.1);
    transform: scale(1);
  }
  20% {
    background-color: #ff6347;
    filter: brightness(1.2);
    transform: scale(1.02);
  }
  40% {
    background-color: #ff8c00;
    filter: brightness(1.3);
    transform: scale(1.03);
  }
  60% {
    background-color: #ff4500;
    filter: brightness(1.4);
    transform: scale(1.01);
  }
  80% {
    background-color: #ff0000;
    filter: brightness(1.2);
    transform: scale(1);
  }
  100% {
    background-color: #ff4500;
    filter: brightness(1.1);
    transform: scale(1);
  }
}

.flag-color-lava {
  animation: lavaFlow 6s ease-in-out infinite;
  will-change: background-color, filter, transform;
}

.scroll-combo-horizontal {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-family: sans-serif;
  color: white;
}

.key {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 6px;
  background-color: #000;
  color: #fff;
  font-weight: bold;
  box-shadow: 0 2px 0 #444;
}

.plus {
  font-size: 16px;
  color: #ccc;
}

.mouse-shell {
  width: 28px;
  height: 45px;
  border: 2px solid #ccc;
  border-radius: 50px;
  position: relative;
  background: transparent;
}

.mouse-left-corner {
  position: absolute;
  top: 0;
  left: 0;
  width: 50%;
  height: 50%;
  background-color: #ff4d4d;
  border-top-left-radius: 50px;
}

.mouse-right-corner {
  position: absolute;
  top: 0;
  right: 0;
  width: 50%;
  height: 50%;
  background-color: #ff4d4d;
  border-top-right-radius: 50px;
}

.mouse-wheel {
  width: 4px;
  height: 8px;
  background-color: #ccc;
  border-radius: 2px;
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
}

#highlighted-wheel {
  background-color: #ff4d4d;
}

.mouse-with-arrows {
  display: flex;
  align-items: center;
  gap: 6px;
}

.mouse-arrows-side {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 14px;
  color: #ccc;
}

.setting-input.keybind:hover .key,
.setting-input.keybind:focus .key {
  background-color: #333;
  box-shadow: 0 2px 0 #222;
}

.setting-input.keybind.listening .key {
  background-color: #1d4ed8; /* blue-700 */
  box-shadow: 0 2px 0 #0f172a; /* darker blue */
}

.settings-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 16px 16px;
  padding: 12px 8px 20px;
  width: 100%;
  margin: 0 auto;
}

.settings-section-title {
  grid-column: 1 / -1;
  text-align: left;
  color: #e5e7eb;
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 0.01em;
  margin: 4px 6px 2px;
}

.settings-section-heading {
  grid-column: 1 / -1;
  text-align: center;
  color: #e5e7eb;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.01em;
  margin: 14px 0 8px;
}

.settings-section-paragraph {
  grid-column: 1 / -1;
  margin: 0 6px 10px;
}

.setting-item {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  background: #1b1b1b;
  border: 1px solid #2f2f2f;
  border-radius: 12px;
  padding: 14px 16px;
  width: 100% !important;
  max-width: 720px;
  min-width: 0 !important;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  transition:
    background 0.25s ease,
    border-color 0.25s ease;
  gap: 12px;
}

@media (max-width: 640px) {
  .settings-list {
    grid-template-columns: 1fr;
    gap: 14px;
    padding: 10px 6px 16px;
  }

  .setting-item {
    max-width: 100%;
    padding: 12px 14px;
  }
}

.setting-item.column {
  flex-direction: column;
}

@keyframes rainbow-background {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

.setting-item.easter-egg {
  background: linear-gradient(
    270deg,
    #990033,
    #996600,
    #336600,
    #008080,
    #1c3f99,
    #5e0099,
    #990033
  );
  background-size: 1400% 1400%;
  animation: rainbow-background 10s ease infinite;
  color: #fff;
}

.easter-egg-popup {
  position: fixed;
  top: 40px;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  padding: 16px 24px;
  background: rgba(0, 0, 0, 0.8);
  color: #fff;
  font-size: 20px;
  border-radius: 12px;
  animation: fadePop 5s ease-out forwards;
  z-index: 9999;
}

.setting-popup {
  position: fixed;
  top: 40px;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  padding: 16px 24px;
  background: rgba(0, 0, 0, 0.8);
  color: #fff;
  font-size: 20px;
  border-radius: 12px;
  animation: fadePop_2 10s ease-out forwards;
  z-index: 9999;
}

@keyframes fadePop {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.6);
  }
  30% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.05);
  }
  70% {
    transform: translate(-50%, -50%) scale(1);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.9);
  }
}

@keyframes fadePop_2 {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.6);
  }
  5% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.05);
  }
  95% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.05);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.9);
  }
}

.setting-item:hover {
  background: #2a2a2a;
  border-color: #3a3a3a;
}

.setting-item.easter-egg:hover {
  background: linear-gradient(
    270deg,
    #990033,
    #996600,
    #336600,
    #008080,
    #1c3f99,
    #5e0099,
    #990033
  );
  background-size: 1400% 1400%;
  animation: rainbow-background 10s ease infinite;
  color: #fff;
}

.setting-label {
  color: #f0f0f0;
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.setting-input {
  margin-left: 16px;
  flex-shrink: 0;
}

.setting-item.vertical {
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  overflow: hidden;
}

.toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}

.slider-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.setting-input.slider.full-width {
  width: 90%;
}

.setting-input.slider {
  width: 100%;
  height: 12px;
  background: transparent;
  border-radius: 6px;
  appearance: none;
  outline: none;
  --fill: 0%;
}

.setting-input.slider::-webkit-slider-runnable-track {
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(
    to right,
    #2196f3 0%,
    #2196f3 var(--fill),
    #444 var(--fill),
    #444 100%
  );
}

.setting-input.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #2196f3;
  cursor: pointer;
}

.setting-input.slider::-moz-range-track {
  background-color: #444;
  height: 10px;
  border-radius: 5px;
}

.setting-input.slider::-moz-range-progress {
  background-color: #2196f3;
  height: 10px;
  border-radius: 5px;
}

.setting-input.slider:focus {
  outline: none;
}

.slider-value {
  width: 100%;
  text-align: center;
  font-size: 13px;
  color: #aaa;
}

.setting-input.number {
  width: 80px;
  padding: 6px 8px;
  border: 1px solid #aaa;
  border-radius: 6px;
  background-color: #ffffff;
  color: #000000;
}

.switch {
  position: relative;
  display: inline-block;
  width: 50px;
  height: 26px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.switch.switch-right {
  display: block;
  margin-left: auto;
}

.slider-round {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #d9534f;
  transition: 0.4s;
  border-radius: 34px;
}

.slider-round::before {
  position: absolute;
  content: "";
  height: 20px;
  width: 20px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: 0.4s;
  border-radius: 50%;
}

.switch input:checked + .slider-round {
  background-color: #4caf50;
}

.switch input:checked + .slider-round::before {
  transform: translateX(24px);
}

.setting-label-group {
  display: flex;
  flex-direction: column;
}

.setting-description {
  font-size: 12px;
  color: #888;
  margin-top: 2px;
  white-space: normal;
  word-break: break-word;
}

.setting-keybind-box {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 12px 16px;
}

.setting-keybind-description {
  flex: 1 1 clamp(320px, 45vw, 620px);
  font-size: 0.95rem;
  color: #e5e7eb;
  word-break: break-word;
  overflow-wrap: break-word;
  max-width: 100%;
  line-height: 1.55;
}

.setting-key {
  background-color: black;
  color: white;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 6px;
  font-family: monospace;
  font-size: 0.875rem;
  box-shadow: 0 2px 0 #444;
  white-space: nowrap;
  user-select: none;
  outline: none;
}

.setting-key:focus {
  outline: 2px solid #3b82f6;
  outline-offset: 2px;
}

.container {
  display: flex;
  padding: 1rem;
  max-width: 540px !important;
  flex-direction: column;
  gap: 1rem;
  opacity: 1;
  transition: opacity 0.3s ease-in-out;
}

.container__row {
  display: flex;
  gap: 1rem;
  align-items: center;
}

.container__row--equal > * {
  flex: 1 1 100%;
}

.l-header {
  background: var(--boxBackgroundColor);
  backdrop-filter: blur(var(--blur-md));
  display: flex;
  justify-content: center;
  padding: 24px 24px 12px;

  @media (min-width: 800px) {
    padding: 24px 24px;
  }
}

.l-header__content {
  display: flex;
  flex: 1;
  max-width: 600px;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.l-header__logo {
  max-width: 450px;
  fill: url(#logo-gradient);
  filter: drop-shadow(1px 1px 0px rgb(255, 255, 255))
    drop-shadow(-1px -1px 0px rgb(255, 255, 255))
    drop-shadow(1px -1px 0px rgb(255, 255, 255))
    drop-shadow(-1px 1px 0px rgb(255, 255, 255))
    drop-shadow(3px 3px 0px rgb(255, 255, 255));
}

.l-header__highlightText {
  color: var(--color-malibu-blue);
  font-weight: 700;
}

/* Base body styles & OpenFront @theme variable overrides (Homepage & Modals)
   Note: <o-modal> is a Shadow DOM host that adopts documentStylesSheet(), where
   Tailwind v4's @layer theme declares `:root, :host { --color-malibu-blue: #0084d1 }`.
   We declare `body.halloween-theme:not(.in-game) o-modal` (excluding in-game modals)
   separately from `:host-context(...)` so browsers without `:host-context()` (Safari/Firefox)
   still apply all variable overrides cleanly. */
body.halloween-theme:not(.in-game),
body.halloween-theme:not(.in-game)
  o-modal:not(
    #game-settings *,
    settings-modal *,
    win-modal *,
    new-lobby-prompt *,
    player-panel *,
    chat-modal *,
    multi-tab-modal *,
    alert-frame *
  ) {
  --color-malibu-blue: #e06c12;
  --color-aquarius: #f08228;
  --color-bright-blue: #e06c12;
  --shadow-malibu-blue: 0 0 8px rgba(224, 108, 18, 0.16);
  --shadow-malibu-blue-soft: 0 0 6px rgba(224, 108, 18, 0.14);
  --shadow-malibu-blue-strong: 0 0 10px rgba(224, 108, 18, 0.22);
  --shadow-malibu-blue-pill: 0 0 5px rgba(224, 108, 18, 0.22);
  --shadow-malibu-blue-ring-sm: 0 0 0 4px rgba(224, 108, 18, 0.2);
  --shadow-malibu-blue-ring-lg: 0 0 0 6px rgba(224, 108, 18, 0.28);
  --shadow-lobby-card-hover:
    0 0 0 2px rgba(255, 255, 255, 0.2), 0 8px 20px rgba(0, 0, 0, 0.6);
  --shadow-action-card-hover:
    0 0 0 1px rgba(255, 255, 255, 0.15), 0 6px 16px rgba(0, 0, 0, 0.5);
}

:host-context(body.halloween-theme:not(.in-game)) {
  --color-malibu-blue: #e06c12;
  --color-aquarius: #f08228;
  --color-bright-blue: #e06c12;
  --shadow-malibu-blue: 0 0 8px rgba(224, 108, 18, 0.16);
  --shadow-malibu-blue-soft: 0 0 6px rgba(224, 108, 18, 0.14);
  --shadow-malibu-blue-strong: 0 0 10px rgba(224, 108, 18, 0.22);
  --shadow-malibu-blue-pill: 0 0 5px rgba(224, 108, 18, 0.22);
  --shadow-malibu-blue-ring-sm: 0 0 0 4px rgba(224, 108, 18, 0.2);
  --shadow-malibu-blue-ring-lg: 0 0 0 6px rgba(224, 108, 18, 0.28);
  --shadow-lobby-card-hover:
    0 0 0 2px rgba(255, 255, 255, 0.2), 0 8px 20px rgba(0, 0, 0, 0.6);
  --shadow-action-card-hover:
    0 0 0 1px rgba(255, 255, 255, 0.15), 0 6px 16px rgba(0, 0, 0, 0.5);
}

/* Guarantee homepage background & logo layer is completely hidden once in-game */
body.halloween-theme.in-game #hex-grid {

}

/* Background image filter overrides - Calmed, dark moody night tint */

  pointer-events: none;
  z-index: 1;
}

/* The homepage scrolls at the document level (required for ad viewability).
   In-game the page is locked: the map canvas is fixed and pans itself. */
html {
  height: 100%; /* Fallback */
  height: 100dvh;
}

body {
  min-height: 100%;
  /* clip (not hidden) so the body doesn't become a scroll container */
  overflow-x: clip;
  /* Safe area padding for notched devices */
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
    env(safe-area-inset-bottom) env(safe-area-inset-left);
}

body.in-game {
  height: 100%;
  overflow: hidden;
}

  background-color: rgb(
    from var(--color-gray-800) r g b / calc(0.92 * var(--hud-opacity, 1))
  );
}

body.in-game .stats-table .bg-gray-800\/85 {
  background-color: rgb(
    from var(--color-gray-800) r g b / calc(0.85 * var(--hud-opacity, 1))
  );
}

body.in-game .stats-table .bg-gray-700\/95 {
  background-color: rgb(
    from var(--color-gray-700) r g b / calc(0.95 * var(--hud-opacity, 1))
  );
}

/* An inline page (store, settings, leaderboard, ...) is a modal rendered in
   the content area: lock the document so it scrolls inside the modal, and
   stack body children in a column so the content area gets the height left
   under the header-ad slot. */
body.page-open {
  height: 100%;
  overflow: hidden;
  flex-direction: column;
  flex-wrap: nowrap;
}

  border-width: 2px !important;
  box-shadow:
    0 0 0 1px rgba(37, 99, 235, 0.5),
    0 0 8px rgba(37, 99, 235, 0.4);
}

/* Amber notification dot pinned to the news button's top-right corner. */
news-button .active button::after {
  content: "";
  position: absolute;
  top: -4px;
  right: -4px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #f59e0b;
  border: 2px solid #fff;
  animation: newsPulse 1.5s ease-in-out infinite;
}

/* Pulsing ring the in-game tutorial puts around the HUD element it's describing. */
.tutorial-highlight {
  border-radius: 0.375rem;
  animation: tutorialHighlight 1.2s ease-in-out infinite;
}

/* Hotbar buttons get the loud treatment: enlarged, gold-tinted, with a
   bobbing arrow pointing at them. The control panel's wide bars keep just
   the ring above (scaling them would break the layout). */
unit-display .tutorial-highlight {
  position: relative;
  z-index: 10;
  transform: scale(1.3);
  transform-origin: bottom center;
  border-color: #ffd700 !important;
  background: rgba(255, 215, 0, 0.25);
}

unit-display .tutorial-highlight::after {
  content: "▼";
  position: absolute;
  bottom: calc(100% + 3px);
  left: 50%;
  color: #ffd700;
  font-size: 15px;
  line-height: 1;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  animation: tutorialArrowBob 0.8s ease-in-out infinite;
  pointer-events: none;
}

@keyframes tutorialArrowBob {
  0%,
  100% {
    transform: translate(-50%, 0);
  }

  50% {
    transform: translate(-50%, -5px);
  }
}

@keyframes tutorialHighlight {
  0%,
  100% {
    box-shadow:
      0 0 0 2px #ffd700,
      0 0 8px rgba(255, 215, 0, 0.5);
  }

  50% {
    box-shadow:
      0 0 0 4px #ffd700,
      0 0 16px rgba(255, 215, 0, 0.9);
  }
}

@keyframes newsPulse {
  0%,
  100% {

  50% {

}

    </style>
    <script>
      window.BOOTSTRAP_CONFIG = {
        gitCommit: "android-1.0",
        assetManifest: {},
        cdnBase: "",
        gameEnv: "prod",
        turnstileSiteKey: "",
        jwtAudience: "openfront"
      };
      document.documentElement.style.setProperty(
        "--background-image-url",
        'url("./images/GameplayScreenshot.png")'
      );
      document.documentElement.style.setProperty(
        "--mobile-logo-image-url",
        'url("./images/OpenFrontLogo.svg")'
      );

      // Android file:/// fetch polyfill via XMLHttpRequest
      (function() {
        const origFetch = window.fetch ? window.fetch.bind(window) : null;
        function xhrFetch(url) {
          return new Promise((resolve, reject) => {
            try {
              const xhr = new XMLHttpRequest();
              xhr.open("GET", url, true);
              xhr.responseType = "arraybuffer";
              xhr.onload = function() {
                if (xhr.status === 200 || (xhr.status === 0 && xhr.response)) {
                  const buf = xhr.response;
                  const headers = new Headers();
                  if (url.endsWith(".json")) headers.set("content-type", "application/json");
                  else if (url.endsWith(".svg")) headers.set("content-type", "image/svg+xml");
                  else if (url.endsWith(".webp")) headers.set("content-type", "image/webp");
                  else if (url.endsWith(".png")) headers.set("content-type", "image/png");
                  resolve(new Response(buf, { status: 200, statusText: "OK", headers }));
                } else {
                  reject(new Error("XHR status " + xhr.status + " for " + url));
                }
              };
              xhr.onerror = function() {
                reject(new Error("XHR network error for " + url));
              };
              xhr.send();
            } catch (e) {
              reject(e);
            }
          });
        }

        window.fetch = function(input, init) {
          const url = typeof input === "string" ? input : (input && input.url ? input.url : String(input));
          if (window.location.protocol === "file:" && (!init || !init.method || init.method === "GET")) {
            return xhrFetch(url);
          }
          if (origFetch) {
            return origFetch(input, init).catch((err) => {
              if (!init || !init.method || init.method === "GET") {
                return xhrFetch(url);
              }
              throw err;
            });
          }
          return xhrFetch(url);
        };
      })();

      // Android hardware back button bridge
      window.__handleAndroidBack = function() {
        try {
          const settingsModal = document.querySelector("settings-modal");
          if (settingsModal && settingsModal.open) {
            settingsModal.closeModal();
            return true;
          }
          if (document.body.classList.contains("in-game")) {
            if (settingsModal && typeof settingsModal.openModal === "function") {
              settingsModal.openModal();
              return true;
            }
          }
          if (window.currentPageId && window.currentPageId !== "page-play" && window.showPage) {
            window.showPage("page-play");
            return true;
          }
        } catch (e) {
          console.warn("Back handler error:", e);
        }
        return false;
      };
    </script>
